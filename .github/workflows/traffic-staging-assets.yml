name: Verify staging static asset permissions
on:
  push:
    branches: [codex/traffic-readiness-20261128]
    paths: ['.github/workflows/traffic-staging-assets.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Restore public readability of the three known candidate scripts
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -eu
            production='/home/clients/67b433575a2b4e8ed916166f746d19d6/sites/videos.connersclinic.com'
            current="$(dirname "$production")/test-videos.connersclinic.com"
            legacy='/home/admin/web/test-videos.connersclinic.com/public_html'
            if [ -d "$current" ] && [ ! -d "$legacy" ]; then staging="$current";
            elif [ -d "$legacy" ] && [ ! -d "$current" ]; then staging="$legacy";
            else echo 'Ambiguous staging location'; exit 1; fi
            cd "$staging"
            [ "$(git rev-parse HEAD)" = '75fa904efd8c91f911a9ea4c593a18cbf9074b0e' ]
            for asset in assets/js/search-suggestions.js assets/js/background-poll.js assets/js/playlist-navigation.js; do
              [ "$(git hash-object "$asset")" = "$(git rev-parse "HEAD:$asset")" ]
              chmod 0644 "$asset"
              status=$(curl --silent --output /dev/null --max-time 10 --write-out '%{http_code}' "https://test-videos.connersclinic.com/$asset")
              [ "$status" = 200 ]
            done
            echo 'Staging candidate JavaScript assets are readable and return HTTP 200'
