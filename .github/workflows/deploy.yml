name: Deploy PlayTube Test Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: playtube-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deploy to test-videos.connersclinic.com
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: |
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SERVER_KEY" | tr -d '\r' > "$key"

          ssh -T -i "$key" -p "$SERVER_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -l "$SERVER_USER" "$SERVER_HOST" 'bash -se' <<'REMOTE'
          cd /home/clients/67b433575a2b4e8ed916166f746d19d6/sites/test-videos.connersclinic.com

          if [ "$(git branch --show-current)" != main ]; then
            echo "Deployment stopped. The server checkout is not on main." >&2
            exit 1
          fi

          export GIT_TERMINAL_PROMPT=0
          git fetch origin main && git reset --hard origin/main || exit 1
          echo "Deployed $(git log -1 --oneline)"
          REMOTE
